version: 2.1

orbs:
  node: circleci/node@7.2.1

workflows:
  version: 2
  workflow:
    jobs:
      - publish:
          context:
            - github
          filters:
            branches:
              only:
                - main

jobs:
  publish:
    docker:
      - image: cimg/node:24.12.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
      - run:
          name: Release
          # Publishes via npm trusted publishing (OIDC), so no NPM_TOKEN is needed.
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            yarn semantic-release
